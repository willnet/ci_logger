# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        gemfile:
          - rails_6_1
          - rails_7_0
          - rails_7_1
          - rails_7_2
          - rails_8_0
          - rails_8_1
        exclude:
          - ruby-version: '4.0'
            gemfile: rails_6_1
          - ruby-version: '4.0'
            gemfile: rails_7_0
          - ruby-version: '4.0'
            gemfile: rails_7_1
          - ruby-version: '3.4'
            gemfile: rails_6_1
          - ruby-version: '3.4'
            gemfile: rails_7_0
          - ruby-version: '3.4'
            gemfile: rails_7_1
          - ruby-version: '3.3'
            gemfile: rails_6_1
          - ruby-version: '3.3'
            gemfile: rails_7_0
          - ruby-version: '2.7'
            gemfile: rails_7_2
          - ruby-version: '3.0'
            gemfile: rails_7_2
          - ruby-version: '2.7'
            gemfile: rails_8_0
          - ruby-version: '3.0'
            gemfile: rails_8_0
          - ruby-version: '3.1'
            gemfile: rails_8_0
          - ruby-version: '2.7'
            gemfile: rails_8_1
          - ruby-version: '3.0'
            gemfile: rails_8_1
          - ruby-version: '3.1'
            gemfile: rails_8_1
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rake

  test-success:
    name: All tests passed
    needs: [test]
    # Always finish this required check, including when a dependency fails or skips.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify required CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
